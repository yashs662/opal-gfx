[package]
name = "opal-gfx"
version = "0.0.0"
edition = "2024"
description = "Reactive GPU UI rendering library"
license = "MIT OR Apache-2.0"

[features]
# Debug-only scripted-input + screenshot harness (REMOVABLE before ship).
# Pulls in `src/automation.rs` + the `#[cfg(feature = "automation")]`
# blocks in `app.rs`. Off by default — never compiled into a normal build.
automation = []

[dependencies]
wgpu = { version = "29.0.1", features = ["noop"] }
winit = "0.30.13"
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11.10"
png = "0.18.1"
cosmic-text = "0.19.0"
etagere = "0.3.0"
resvg = "0.45"
tiny-skia = "0.11"
arboard = "3"

# Startup splash (see src/splash.rs). Windows uses a layered window for
# true per-pixel alpha via the Win32 API; other platforms present an
# opaque panel via softbuffer.
# Shader validation only (see `gpu::effects` tests): the same WGSL front
# end wgpu compiles with, so a broken effect fails `cargo test` instead of
# a user's window.
[dev-dependencies]
naga = { version = "29.0.1", features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(not(windows))'.dependencies]
softbuffer = "0.4"

# Reach the CAMetalLayer wgpu creates to bound `nextDrawable` (see
# `GpuContext::allow_drawable_timeout`). Same versions wgpu/winit pull.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }

[[example]]
name = "hello_window"
path = "examples/hello_window.rs"

[[example]]
name = "layering"
path = "examples/layering.rs"

[[example]]
name = "text_effects"
path = "examples/text_effects.rs"

[[example]]
name = "glass_grid"
path = "examples/glass_grid.rs"

[[example]]
name = "routes"
path = "examples/routes.rs"

[[example]]
name = "text_input"
path = "examples/text_input.rs"

[[example]]
name = "lazy_list"
path = "examples/lazy_list.rs"

[[example]]
name = "lazy_list_expand"
path = "examples/lazy_list_expand.rs"

[[example]]
name = "focus_cycle"
path = "examples/focus_cycle.rs"

[[example]]
name = "modal"
path = "examples/modal.rs"

